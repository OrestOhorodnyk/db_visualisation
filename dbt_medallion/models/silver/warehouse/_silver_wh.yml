version: 2

models:
  - name: slv_wh__warehouses
    description: Cleaned warehouse facilities.
    columns:
      - name: warehouse_id
        data_tests: [unique, not_null]
      - name: warehouse_code
        data_tests: [unique, not_null]

  - name: slv_wh__warehouse_zones
    description: Cleaned functional zones inside warehouses.
    data_tests:
      - unique:
          arguments:
            column_name: "warehouse_id || '|' || zone_code"
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
      - name: warehouse_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__warehouses')
                field: warehouse_id
      - name: zone_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["receiving", "bulk_storage", "picking", "cold_storage", "quarantine", "shipping"]

  - name: slv_wh__storage_locations
    description: Storage bins flattened with their zone and warehouse attributes.
    columns:
      - name: location_id
        data_tests: [unique, not_null]
      - name: location_code
        data_tests: [unique, not_null]
      - name: zone_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__warehouse_zones')
                field: zone_id
      - name: zone_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["receiving", "bulk_storage", "picking", "cold_storage", "quarantine", "shipping"]
      - name: is_sellable
        description: >
          True when stock in this bin can be promised to customers: the bin is not blocked, the warehouse
          is active, and the zone is bulk_storage, picking, or cold_storage.
        data_tests: [not_null]

  - name: slv_wh__items
    description: Cleaned warehouse item master with normalized SKU.
    columns:
      - name: item_id
        data_tests: [unique, not_null]
      - name: sku
        description: Normalized SKU, the conformed key shared with e-shop `products.sku`.
        data_tests: [unique, not_null]
      - name: barcode
        data_tests: [unique]
      - name: uom
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["pcs", "box", "pallet", "kg", "liter"]

  - name: slv_wh__item_lots
    description: Cleaned batch/lot records with expiry enrichment.
    data_tests:
      - unique:
          arguments:
            column_name: "item_id || '|' || lot_number"
    columns:
      - name: lot_id
        data_tests: [unique, not_null]
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__items')
                field: item_id
      - name: days_to_expiry
        description: Days from today until expiration_date (negative when expired, NULL when no expiry).
      - name: is_expired
        data_tests: [not_null]

  - name: slv_wh__inventory_balances
    description: Stock balances per bin and lot with available quantity.
    columns:
      - name: balance_id
        data_tests: [unique, not_null]
      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__storage_locations')
                field: location_id
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__items')
                field: item_id
      - name: lot_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_wh__item_lots')
                field: lot_id
      - name: quantity_available
        description: quantity_on_hand - quantity_allocated.

  - name: slv_wh__suppliers
    description: Cleaned supplier master.
    columns:
      - name: supplier_id
        data_tests: [unique, not_null]
      - name: tax_id
        data_tests: [unique]

  - name: slv_wh__inbound_shipments
    description: Cleaned inbound shipment (ASN) headers.
    columns:
      - name: inbound_shipment_id
        data_tests: [unique, not_null]
      - name: receipt_number
        data_tests: [unique, not_null]
      - name: warehouse_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__warehouses')
                field: warehouse_id
      - name: supplier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__suppliers')
                field: supplier_id
      - name: shipment_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["draft", "in_progress", "completed", "cancelled"]

  - name: slv_wh__inbound_shipment_lines
    description: Cleaned inbound shipment lines with receiving variance.
    columns:
      - name: inbound_line_id
        data_tests: [unique, not_null]
      - name: inbound_shipment_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__inbound_shipments')
                field: inbound_shipment_id
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__items')
                field: item_id
      - name: lot_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_wh__item_lots')
                field: lot_id
      - name: variance_qty
        description: received_qty - expected_qty (negative means short delivery).

  - name: slv_wh__outbound_orders
    description: Cleaned outbound fulfillment order headers.
    columns:
      - name: outbound_order_id
        data_tests: [unique, not_null]
      - name: outbound_order_number
        data_tests: [unique, not_null]
      - name: warehouse_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__warehouses')
                field: warehouse_id
      - name: external_order_ref
        description: Upstream order reference; e-shop order_number for storefront orders.
      - name: outbound_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["draft", "in_progress", "completed", "cancelled"]
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: slv_wh__outbound_order_lines
    description: Cleaned outbound order lines.
    columns:
      - name: outbound_line_id
        data_tests: [unique, not_null]
      - name: outbound_order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__outbound_orders')
                field: outbound_order_id
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__items')
                field: item_id

  - name: slv_wh__stock_movements
    description: Cleaned immutable stock movement ledger.
    columns:
      - name: movement_id
        data_tests: [unique, not_null]
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_wh__items')
                field: item_id
      - name: lot_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_wh__item_lots')
                field: lot_id
      - name: from_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_wh__storage_locations')
                field: location_id
      - name: to_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_wh__storage_locations')
                field: location_id
      - name: movement_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - inbound_receipt
                  - putaway
                  - internal_transfer
                  - replenishment
                  - outbound_pick
                  - adjustment_plus
                  - adjustment_minus
      - name: quantity
        data_tests: [not_null]
